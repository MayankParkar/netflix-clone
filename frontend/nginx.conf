server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # React Router uses client-side routing — if a user refreshes the page
    # on a route like /movies/5, there's no actual /movies/5 file on disk.
    # This line tells Nginx: "if the requested file doesn't exist, serve
    # index.html instead and let React's router handle the URL"
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively — they have content hashes in their
    # filenames (e.g. main.a1b2c3.js), so a new deploy gets a new filename
    # and old cached files never cause stale content bugs
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
